[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serve-git"
version = "0.1.0"
description = "Temporarily share a local Git repository over ngrok for peer clone/fetch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pablo Ventura" }]
keywords = ["git", "ngrok", "smart-http", "share"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pablogventura/serve-git"
Repository = "https://github.com/pablogventura/serve-git"
Issues = "https://github.com/pablogventura/serve-git/issues"
[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
serve-git = "serve_git.cli:main_serve"
stop-serve-git = "serve_git.cli:main_stop"

[tool.setuptools.packages.find]
include = ["serve_git*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
